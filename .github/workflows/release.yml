# SPDX-License-Identifier: MIT OR Apache-2.0
# Pushing a tag such as v0.2.0 builds the mod and publishes a release with a zip
# that unpacks straight into the Fahrenheit folder. A tag with a "-" (v0.2.0-alpha)
# makes a prerelease.
name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Build
      run: dotnet build -c Release -p:Version="${GITHUB_REF_NAME#v}" ffx-debug-revival.slnx

    - name: Package
      run: dotnet run tools/package.cs -- "yuta.debugrevival-${GITHUB_REF_NAME}.zip"

    - name: Publish
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        prerelease=""
        case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
        gh release create "$GITHUB_REF_NAME" "yuta.debugrevival-${GITHUB_REF_NAME}.zip" \
          --verify-tag $prerelease --title "Debug Revival $GITHUB_REF_NAME" --notes-file .github/release-notes.md
