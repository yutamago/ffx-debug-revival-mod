name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  BUILD_CONFIGURATION: release

jobs:
  build:
    # The tools must run on every OS a modder may use.
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Build the mod
      run: dotnet build -c ${{ env.BUILD_CONFIGURATION }} ffx-debug-revival.slnx

    - name: Build the tools
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        dotnet build -c ${{ env.BUILD_CONFIGURATION }} tools/DisasmCheck
        dotnet build -c ${{ env.BUILD_CONFIGURATION }} tools/GsCheck
        foreach ($script in 'gen-natives', 'gen-map-table', 'package') { dotnet build tools/$script.cs }

    # The other tools need the game's files, which CI doesn't have.
    - name: Package
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        dotnet run tools/package.cs -- yuta.debugrevival-ci.zip
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $zip = [IO.Compression.ZipFile]::OpenRead("$PWD/yuta.debugrevival-ci.zip")
        $names = $zip.Entries.FullName
        $zip.Dispose()
        $names
        if ($names -notcontains 'mods/yuta.debugrevival/yuta.debugrevival.dll') { throw 'the zip has no mod DLL' }
